<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2</title>
</head>
<body>
    <style>
        *{
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            background: #ffffff;
        }

        button{
            height: 38px;
        }

        .buttons{
            margin: 20px;
        }

        .bootstrap, .linkedin{
            display: flex;
            flex-direction: row;
            gap: 15px;
        }

        .uber-btn{
            padding-left: 20px;
            padding-right: 20px;
            color: #ffffff;
            background-color: #000000;
            border: none;
            transition: background-color 0.15s;
        }

        .uber-btn:hover{
            background-color: #333333;
        }

        .amazon-btn-1{
            padding-left: 50px;
            padding-right: 50px;
            font-size: 15px;
            color: #000000;
            background-color: rgb(255, 216, 20);
            border: none;
            border-radius: 35px;
            transition: background-color 0.15s;
        }

        .amazon-btn-1:hover{
            background-color: rgb(255, 196, 20);
        }

        .amazon-btn-1:active, .amazon-btn-2:active{
            opacity: 0.7;
        }

        .amazon-btn-2{
            padding-left: 50px;
            padding-right: 50px;
            font-size: 15px;
            color: #000000;
            background-color: rgb(255, 164, 28);
            border: none;
            border-radius: 35px;
        }

        .amazon-btn-2:hover{
            background-color: rgb(210, 134, 20);
        }

        .github-btn{
            padding-left: 25px;
            padding-right: 25px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: rgb(46, 164, 79);
            border: none;
            border-radius: 7px;
            height: 40px;
            transition: box-shadow 0.15s;
        }

        .github-btn:hover{
            box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.2);
        }

        .bootstrap-btn-1{
            padding-left: 25px;
            padding-right: 25px;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            background-color: rgb(121, 82, 179);
            border: none;
            border-radius: 4px;
            height: 40px;
            transition: background-color 0.15s;
        }

        .bootstrap-btn-1:hover{
            background-color: rgb(82, 56, 120);
        }

        .bootstrap-btn-2{
            padding-left: 25px;
            padding-right: 25px;
            font-size: 15px;
            font-weight: bold;
            color: #666667;
            background-color: none;
            border: 1px solid #666667;
            border-radius: 4px;
            height: 40px;
            transition: color 0.15s, background-color 0.15s;
        }

        .bootstrap-btn-2:hover{
            color: #ffffff;
            background-color: #666667;
        }

        .linkedin-btn-1{
            padding-left: 25px;
            padding-right: 25px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background-color: rgb(10, 102, 194);
            border: none;
            border-radius: 30px;
            height: 45px;
            transition: background-color 0.15s;
        }

        .linkedin-btn-1:hover{
            background-color: rgb(5, 60, 115);
        }

        .linkedin-btn-2{
            padding-left: 25px;
            padding-right: 25px;
            font-size: 18px;
            font-weight: bold;
            color: rgb(10, 102, 194);
            background-color: none;
            border: 1px solid rgb(10, 102, 194);
            border-radius: 30px;
            height: 45px;
            transition: color 0.15s, background-color 0.15s;
        }

        .linkedin-btn-2:hover{
            color: #ffffff;
            background-color: rgb(10, 102, 194);
        }

        .amazon-order{
            font-family: serif;
            width: 400px;
            height: 200px;
            border: 1px solid #000000;
            align-items: center;
            justify-content: center;
            padding-left: 10px;
        }

        .amazon{
            display: flex;
            flex-direction: row;
            gap: 10px;
        }
    </style>



    <div class="buttons uber">
        <button class="uber-btn">Request now</button>
    </div>

    <div class="buttons amazon">
        <button class="amazon-btn-1">Add to Cart</button>
    </div>

    <div class="buttons github">
        <button class="github-btn">Sign up</button>
    </div>

    <div class="buttons bootstrap">
        <button class="bootstrap-btn-1">Get started</button>
        <button class="bootstrap-btn-2">Download</button>
    </div>

    <div class="buttons linkedin">
        <button class="linkedin-btn-1">Apply on company website</button>
        <button class="linkedin-btn-2">Save</button>
    </div>

    <div class="amazon-order">
        <a href="#" style="color: rgb(0, 113, 133)">Back to Amazon</a>
        <h3>Nike Black Running Shoes</h3>
        <p style="color: rgb(0, 118, 0);">$39 - in stock.</p>
        <p>Free delivery tomorrow.</p>
        <div class="buttons amazon">
            <button class="amazon-btn-1">Add to Cart</button>
            <button class="amazon-btn-2">Buy now</button>
        </div>
    </div>
    
</body>
</html>
